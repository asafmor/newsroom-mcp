name: Deploy feed site

# Builds site/ (the standalone React feed UI) and publishes it onto the
# `feed` branch's GitHub Pages root, alongside the existing feed.json,
# podcast.json, and audio/ (synthesized episode mp3s). None of the three is
# touched here — feed.json is published separately by `npm run
# publish-feed` (scripts/publish-feed.ts) after a curation run, and
# podcast.json + audio/ by `npm run publish-podcast` (Phase 1) / the
# synthesize-podcast workflow (Phase 2). The cleanup step below MUST keep
# excluding all three, or a site deploy silently destroys whichever one it
# forgets.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "views/_shared/**"
      - ".github/workflows/deploy-feed-site.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:site

      - name: Checkout feed branch
        uses: actions/checkout@v5
        with:
          ref: feed
          path: feed-branch

      - name: Publish built site, preserving feed.json, podcast.json, and audio/
        run: |
          find feed-branch -mindepth 1 -maxdepth 1 ! -name feed.json ! -name podcast.json ! -name audio ! -name .git -exec rm -rf {} +
          cp -r site/dist/. feed-branch/

      - name: Commit and push
        working-directory: feed-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Deploy feed site from ${GITHUB_SHA::7}"
          git push origin feed
